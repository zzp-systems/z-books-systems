# ──────────────────────────────────────────────
# z-books-systems — Cloudflare Pages Configuration
# Jang-Jang Bakeshop ERP — Accounting / ARAP Module
# ──────────────────────────────────────────────

name = "z-books-systems"
compatibility_date = "2026-11-15"
pages_build_output_dir = "dist"

# ── D1 Database Binding ──
[[d1_databases]]
binding = "DB"
database_name = "jjb-arap-db"
database_id = "a1c91009-c32d-4f12-97b0-c22cde486a59"

# ── R2 Bucket Binding (shared with CRM + WMS) ──
# Use path prefix: arap/ for accounting files (invoices, receipts, vouchers)
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "jjb-erp-assets"

# ── Secrets (set via CLI, NOT in this file) ──
# wrangler pages secret put JWT_SECRET     (shared with CRM + WMS for SSO)
# wrangler pages secret put SYNC_API_KEY    (shared sync auth key)
# wrangler pages secret put CRM_API_URL     (for pushing AR invoices back to CRM)
# wrangler pages secret put WMS_API_URL     (for querying supplier/receiving data)

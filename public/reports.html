<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Books - Financial Reports & BIR Tax Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-amber-600 flex items-center justify-center font-bold text-white shadow">Z</div>
        <div>
          <h1 class="text-base font-bold text-white">Z-Books: Financial Statements & BIR Tax Center</h1>
          <p class="text-xs text-slate-400">Jang-Jang Bakeshop | PFRS for SMEs Accrual Reporting</p>
        </div>
      </div>
      <div class="flex items-center gap-3 text-xs">
        <a href="/" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">← Main React SPA</a>
        <a href="/journal.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">Journal Voucher</a>
        <a href="/payroll.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">Payroll Runner</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
    <!-- Tab Controls & Export -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-xl">
      <div class="flex flex-wrap gap-2 text-xs">
        <button id="tabPnl" class="px-3 py-1.5 rounded-lg bg-amber-600 text-white font-medium shadow cursor-pointer">
          Manufacturing P&L (COGM)
        </button>
        <button id="tabTb" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium cursor-pointer">
          Trial Balance
        </button>
        <button id="tabBir" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium cursor-pointer">
          BIR Tax Returns (2550Q/1701Q)
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="window.print()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg border border-slate-700 font-medium cursor-pointer">
          Print
        </button>
      </div>
    </div>

    <!-- Active Report Display Area -->
    <div id="reportContainer">
      <!-- Populated via app-reports.js -->
    </div>
  </main>

  <script src="/app-reports.js"></script>
</body>
</html>
